<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="{{theme}}">
<meta name="robots" content="noindex">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<!-- Link preview for Telegram and other messengers. This page is public; the game itself is encrypted. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{title}}">
<meta property="og:locale" content="uk_UA">
<meta property="og:title" content="{{shareTitle}}">
<meta property="og:description" content="{{shareDescription}}">
<meta property="og:image" content="{{imageUrl}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{imageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{shareTitle}}">
<meta name="twitter:description" content="{{shareDescription}}">
<meta name="twitter:image" content="{{imageUrl}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{{emoji}}</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/style.css">
<link rel="modulepreload" href="../lib/lock.js">
</head>
<body>
<main class="card" id="lock">
  <img class="cover" src="{{image}}" alt="{{imageAlt}}" width="1200" height="630">
  <h1 class="title">{{title}}</h1>
  <form id="unlock" hidden>
    <p class="lead">Гра з нашої Ігротеки. Введи свій пароль.</p>
    <input type="text" name="username" value="Ігротека" autocomplete="username" hidden>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Пароль" aria-label="Пароль" required>
    <button class="btn" type="submit">Грати</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="busy" id="busy">Відкриваю гру…</p>
  <a class="btn ghost" href="../">Усі ігри</a>
  <noscript><p class="err">Без JavaScript гра не відкриється.</p></noscript>
</main>
<script>
  // the lock is a module: if this browser cannot run it, say so instead of spinning forever
  setTimeout(function () { if (!window.__ihrotekaBooted) document.getElementById('busy').textContent = 'Цей браузер застарий для бібліотеки. Онови його або відкрий в іншому.'; }, 8000);
</script>
<script type="module">
  import { bootGame } from '../lib/lock.js';
  bootGame({{idJson}});
</script>
</body>
</html>
